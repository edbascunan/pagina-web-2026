*{margin:0;padding:0;box-sizing:border-box}
:root{--R:#C0201E;--K:#080808;--K2:#111111;--W:#F0EBE3;--W2:#9E9690;--W3:#5A5550;--F:'Bebas Neue',sans-serif;--B:'DM Sans',sans-serif;--M:'Space Mono',monospace}
body{background:var(--K);color:var(--W);font-family:var(--B);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;position:relative;overflow:hidden}

.code{font-family:var(--F);font-size:clamp(7rem,20vw,14rem);line-height:1;color:var(--R);opacity:.15;position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none;user-select:none}
.content{position:relative;z-index:2}
.eyebrow{font-family:var(--M);font-size:.58rem;letter-spacing:.28em;color:var(--R);margin-bottom:1rem;text-transform:uppercase}
h1{font-family:var(--F);font-size:clamp(2.5rem,6vw,4rem);line-height:.95;margin-bottom:1rem}

p{color:var(--W2);font-size:.9rem;font-weight:300;max-width:420px;line-height:1.8;margin:0 auto 2.5rem}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.btn-p{background:var(--R);color:var(--W);padding:.85rem 2rem;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;font-family:var(--B);font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:opacity .2s}
.btn-p:hover{opacity:.85}
.btn-s{background:transparent;color:var(--W);border:1px solid rgba(240,235,227,.2);padding:.85rem 1.6rem;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-family:var(--B);cursor:pointer;text-decoration:none;transition:all .2s}
.btn-s:hover{border-color:var(--R);color:var(--R)}
.wa{display:flex;align-items:center;gap:.5rem;color:#25D366;font-family:var(--M);font-size:.6rem;letter-spacing:.1em;text-decoration:none;justify-content:center;margin-top:2rem;transition:opacity .2s}
.wa:hover{opacity:.75}
